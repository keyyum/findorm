name: Screenshots

# Takes the UI screenshots for the project documentation from the running app.
# Runs on a push whose commit message contains [screenshots], or by hand.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/findorm_shots
      JWT_SECRET: ci-only-secret
      PORT: 5050
      RATE_LIMIT: "off"
      ADMIN_EMAIL: admin@findorm.test
      ADMIN_PASSWORD: AdminPass2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the API and load demo data
        working-directory: server
        run: |
          npm ci
          npm run create-admin
          node index.js > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5050/api/health && break; sleep 1; done
          npm run seed-demo
          npm run seed-dorms
      - name: Build and serve the client
        working-directory: client
        run: |
          npm ci
          npm run build
          npx vite preview --port 5173 > ../client.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173 >/dev/null && break; sleep 1; done
      - name: Take the screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/pw" docs/screenshots
          cp .github/screenshots/capture.mjs "$RUNNER_TEMP/pw/"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm i playwright
          npx playwright install --with-deps chromium
          node capture.mjs "$GITHUB_WORKSPACE/docs/screenshots"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots
      - name: Commit the screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "docs: add UI screenshots for Figures 12 and 28" || exit 0
          git push origin HEAD:${{ github.ref_name }}
      - name: Show logs on failure
        if: failure()
        run: |
          tail -50 api.log || true
          tail -50 client.log || true
